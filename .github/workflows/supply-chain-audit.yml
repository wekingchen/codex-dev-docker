name: 审计供应链固定项

on:
  workflow_dispatch:
  schedule:
    # 每周一 UTC 04:13 检查 Actions、Ubuntu、mise、Node.js LTS 和 Trivy 漂移。
    - cron: "13 4 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: 检查供应链版本与 digest
    runs-on: ubuntu-24.04

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 运行只读供应链审计
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/audit-supply-chain.sh
